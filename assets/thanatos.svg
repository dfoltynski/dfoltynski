<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 232" role="img" aria-label="thanatos: Proof-of-concept deployment orchestrator: TypeScript API, Go engine on the Docker API. Commit-pinned builds, per-target locking.">
<style>:root{--bg:#f6f8fa;--bg2:#ffffff;--line:#d0d7de;--fg:#1f2328;--dim:#59636e;--a:#0969da;--b:#bf3989;--c:#1a7f37}
@media (prefers-color-scheme:dark){:root{--bg:#0d1117;--bg2:#161b22;--line:#30363d;--fg:#f0f6fc;--dim:#9198a1;--a:#58a6ff;--b:#f778ba;--c:#3fb950}}
.h{font:600 25px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:var(--a)}.t{font:400 19px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:var(--fg)}.s{font:400 16px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:var(--dim)}
</style>
<rect x=".75" y=".75" width="478.5" height="230.5" rx="11" fill="var(--bg2)" stroke="var(--line)" stroke-width="1.5"/>
<circle cx="35" cy="47" r="7" fill="var(--a)"/>
<text class="h" x="52" y="56">thanatos</text><text class="t" x="28" y="94">Proof-of-concept deployment orchestrator:</text><text class="t" x="28" y="122">TypeScript API, Go engine on the Docker API.</text><text class="t" x="28" y="150">Commit-pinned builds, per-target locking.</text>
<text class="s" x="28" y="200">TypeScript  ·  Go  ·  Docker  ·  PostgreSQL</text></svg>